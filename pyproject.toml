[project]
name = "mofwater"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rahulr@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fairchem-core>=2.20.0",
    "fairchem-data-odac>=0.1.0",
    "matminer>=0.10.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "pymatgen>=2026.5.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.3",
]

[project.scripts]
mofwater = "mofwater:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
